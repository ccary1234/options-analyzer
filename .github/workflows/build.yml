name: Build options data

on:
  schedule:
    # 22:30 UTC Mon-Fri = 5:30pm Central (after the 4pm close + delayed-quote lag)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}     # "Run workflow" button for manual refreshes
  push:
    paths: [basket.txt]      # rebuild whenever the basket changes

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build data.json
        run: python build_data.py --basket basket.txt --out docs/data.json

      - name: Commit if changed
        run: |
          git config user.name "options-screener bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update data $(date -u +%F)" && git push
